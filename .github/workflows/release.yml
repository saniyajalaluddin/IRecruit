name: IRecruit Release & Container Packaging

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-and-release:
    name: Build & Verify Production Container
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: irecruit:${{ github.ref_name }}
          load: true

      - name: Verify Runtime Dependencies in Built Image
        run: |
          docker run --rm \
            irecruit:${{ github.ref_name }} \
            python -c "import greenlet; print('Runtime greenlet:', greenlet.__version__)"
          
          docker run --rm \
            irecruit:${{ github.ref_name }} \
            python -c "from sqlalchemy.ext.asyncio import AsyncSession, async_sessionmaker, create_async_engine; print('Runtime SQLAlchemy asyncio import OK')"

      - name: Verify Container Health Check
        run: |
          docker rm -f irecruit-smoke || true
          docker run -d --name irecruit-smoke -p 8000:8000 \
            -e ENVIRONMENT=production \
            -e SECRET_KEY=production-test-key-32-chars-long \
            -e JWT_SECRET_KEY=production-test-key-32-chars-long \
            irecruit:${{ github.ref_name }}
          
          # Retry loop waiting for container to initialize
          READY=0
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Health check succeeded on attempt $i"
              READY=1
              break
            fi
            echo "Waiting for container to become healthy (attempt $i/30)..."
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Container failed health check"
            echo "=== Container Status ==="
            docker inspect irecruit-smoke || true
            echo "=== Container Logs ==="
            docker logs irecruit-smoke
            docker rm -f irecruit-smoke || true
            exit 1
          fi

          docker rm -f irecruit-smoke || true
          echo "Production container smoke test passed."

      - name: Post-Run Container Cleanup
        if: always()
        run: |
          docker rm -f irecruit-smoke || true

